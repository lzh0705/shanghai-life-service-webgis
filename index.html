<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="上海市生活服务设施查询系统">
  <title>上海市生活服务设施查询系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(11, 25, 43, .92);
      --panel-soft: rgba(14, 33, 55, .82);
      --line: rgba(117, 167, 206, .2);
      --text: #e8f1f8;
      --muted: #8197ab;
      --cyan: #38d9c5;
      --blue: #4698ff;
      --green: #42d392;
      --orange: #ffab4c;
      --red: #ff5f6d;
      --gray: #8795a3;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, "Noto Sans SC", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      display: grid;
      grid-template-rows: 70px 1fr;
      width: 100vw;
      height: 100vh;
      min-width: 1080px;
      background:
        radial-gradient(circle at 42% 15%, rgba(34, 111, 160, .15), transparent 32%),
        #07111f;
    }

    .topbar {
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 17, 31, .96);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .24);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 310px;
    }
    .brand-mark {
      position: relative;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(56, 217, 197, .75);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(56,217,197,.22), rgba(70,152,255,.08));
      box-shadow: inset 0 0 18px rgba(56,217,197,.12), 0 0 22px rgba(56,217,197,.12);
    }
    .brand-mark::before, .brand-mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--cyan);
      transform: rotate(45deg);
    }
    .brand-mark::after { inset: 13px; background: var(--cyan); }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .08em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .16em; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      flex: 1;
      gap: 12px;
    }
    .kpi {
      position: relative;
      min-width: 0;
      padding: 9px 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(24, 50, 77, .55), rgba(10, 25, 44, .4));
    }
    .kpi::after {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--kpi-color, var(--cyan));
    }
    .kpi-label { color: var(--muted); font-size: 11px; }
    .kpi-value { margin-top: 3px; font-size: 20px; font-weight: 700; }
    .kpi-value small { margin-left: 4px; color: var(--muted); font-size: 11px; font-weight: 400; }
    .pulse { color: var(--red); animation: pulse 1.7s infinite; }
    @keyframes pulse { 50% { opacity: .5; text-shadow: 0 0 15px var(--red); } }
    .time-box { min-width: 170px; text-align: right; }
    .time-box strong { display: block; font-size: 16px; letter-spacing: .08em; }
    .time-box span { color: var(--muted); font-size: 11px; }

    .workspace {
      position: relative;
      display: grid;
      grid-template-columns: 292px minmax(460px, 1fr) 330px;
      gap: 12px;
      min-height: 0;
      padding: 12px;
    }
    .panel {
      position: relative;
      z-index: 500;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 18px 40px rgba(0,0,0,.2);
      backdrop-filter: blur(14px);
    }
    .left-panel, .right-panel { display: flex; flex-direction: column; overflow: hidden; }
    .left-panel {
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-color: #31516a rgba(5, 16, 29, .45);
      scrollbar-width: thin;
    }
    .left-panel::-webkit-scrollbar { width: 6px; }
    .left-panel::-webkit-scrollbar-track { background: rgba(5, 16, 29, .45); }
    .left-panel::-webkit-scrollbar-thumb { border-radius: 8px; background: #31516a; }
    .left-panel::-webkit-scrollbar-thumb:hover { background: #3e6a87; }
    .section { padding: 18px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 14px;
      font-size: 14px;
      letter-spacing: .04em;
    }
    .section-title::before {
      content: "";
      width: 3px; height: 14px;
      margin-right: 8px;
      border-radius: 2px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }
    .section-title span:first-child { display: flex; align-items: center; }
    .count { color: var(--muted); font-size: 11px; font-weight: 400; }

    .search {
      display: flex;
      align-items: center;
      height: 39px;
      padding: 0 12px;
      border: 1px solid rgba(111,151,185,.25);
      border-radius: 7px;
      background: rgba(4,15,27,.7);
    }
    .search::before { content: "⌕"; margin-right: 8px; color: var(--cyan); font-size: 21px; }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }
    .search input::placeholder { color: #647a8e; }

    .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      background: rgba(20,43,67,.55);
      transition: .2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: rgba(56,217,197,.65);
      background: rgba(56,217,197,.12);
      transform: translateY(-1px);
    }
    .filter-btn .icon { font-size: 15px; }
    .filter-btn .label { flex: 1; text-align: left; font-size: 12px; }
    .filter-btn .num { color: var(--muted); font-size: 10px; }
    .status-list { display: grid; gap: 9px; }
    .status-row { display: flex; align-items: center; color: #adc0d0; font-size: 12px; }
    .status-row input { accent-color: var(--cyan); }
    .status-row label { display: flex; flex: 1; align-items: center; margin-left: 7px; cursor: pointer; }
    .status-dot { width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--status); box-shadow: 0 0 8px var(--status); }
    .status-row em { color: var(--muted); font-style: normal; }
    .mini-chart-wrap { flex: 0 0 260px; min-height: 260px; }
    #categoryChart { width: 100%; height: 210px; min-height: 210px; }

    .map-shell { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
    #map { width: 100%; height: 100%; background: #0b1a26; }
    .map-vignette {
      position: absolute;
      z-index: 400;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 90px rgba(3,11,20,.48);
    }
    .map-title {
      position: absolute;
      z-index: 500;
      top: 16px; left: 16px;
      padding: 10px 13px;
      border: 1px solid rgba(117,167,206,.25);
      border-radius: 8px;
      background: rgba(7,17,31,.87);
      backdrop-filter: blur(10px);
    }
    .map-title strong { display: block; font-size: 13px; }
    .map-title span { color: var(--muted); font-size: 10px; }
    .map-legend {
      position: absolute;
      z-index: 500;
      left: 16px; bottom: 17px;
      display: flex;
      gap: 14px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(7,17,31,.87);
      color: #adbfcd;
      font-size: 10px;
    }
    .map-legend span { display: flex; align-items: center; }
    .map-legend i { width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--c); }
    .draw-toolbar {
      position: absolute;
      z-index: 510;
      top: 72px;
      left: 16px;
      display: flex;
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(7,17,31,.9);
      backdrop-filter: blur(10px);
    }
    .draw-toolbar button {
      padding: 7px 10px;
      border: 1px solid rgba(56,217,197,.25);
      border-radius: 5px;
      cursor: pointer;
      background: rgba(56,217,197,.08);
      font-size: 10px;
    }
    .draw-toolbar button:hover { border-color: var(--cyan); color: var(--cyan); }
    .basemap-switch {
      position: absolute;
      z-index: 510;
      top: 16px;
      right: 16px;
      padding: 9px 13px;
      border: 1px solid rgba(56,217,197,.35);
      border-radius: 7px;
      cursor: pointer;
      background: rgba(7,17,31,.9);
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      backdrop-filter: blur(10px);
      font-size: 11px;
    }
    .basemap-switch:hover { border-color: var(--cyan); color: var(--cyan); }

    .right-head { padding: 18px; border-bottom: 1px solid var(--line); }
    .selected-name { margin: 0 0 5px; font-size: 19px; }
    .selected-meta { color: var(--muted); font-size: 11px; }
    .result-list {
      flex: 1;
      min-height: 0;
      padding: 9px 10px;
      overflow-y: auto;
    }
    .result-list::-webkit-scrollbar { width: 5px; }
    .result-list::-webkit-scrollbar-thumb { border-radius: 5px; background: #25425b; }
    .poi-card {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 7px;
      padding: 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(18,39,62,.58);
      transition: .2s ease;
    }
    .poi-card:hover, .poi-card.active { border-color: rgba(56,217,197,.5); background: rgba(32,65,88,.72); }
    .poi-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; background: rgba(67,117,153,.18); font-size: 18px; }
    .poi-main { min-width: 0; }
    .poi-name { overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .poi-address { margin-top: 5px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .poi-distance { color: var(--cyan); font-size: 10px; }
    .poi-status { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--status); font-size: 9px; }
    .poi-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .chart-panel { height: 242px; padding: 15px 16px 8px; border-top: 1px solid var(--line); }
    #trendChart { width: 100%; height: 190px; }

    .custom-marker { position: relative; display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid rgba(255,255,255,.82); border-radius: 9px 9px 9px 2px; color: white; font-size: 13px; transform: rotate(-45deg); box-shadow: 0 4px 16px rgba(0,0,0,.45); }
    .custom-marker span { transform: rotate(45deg); }
    .custom-marker.busy::after { content: ""; position: absolute; inset: -6px; border: 1px solid var(--orange); border-radius: 50%; animation: markerPulse 1.8s infinite; }
    @keyframes markerPulse { 70%, 100% { opacity: 0; transform: scale(1.35); } }
    .area-actions { display: flex; gap: 7px; margin-top: 12px; }
    .area-btn {
      padding: 7px 10px;
      border: 1px solid rgba(56,217,197,.35);
      border-radius: 6px;
      cursor: pointer;
      background: rgba(56,217,197,.1);
      color: var(--cyan);
      font-size: 10px;
    }
    .area-btn:hover { background: rgba(56,217,197,.2); }
    .draw-tip { color: var(--muted); font-size: 10px; line-height: 1.6; }
    .amap-logo, .amap-copyright { opacity: .65 !important; }
    .amap-info-content { color: var(--text); border-radius: 8px; background: #0c2034; }
    .amap-info-close { color: #fff !important; }
    .amap-info-sharp { border-top-color: #0c2034 !important; }
    .popup h3 { margin: 0 0 8px; font-size: 14px; }
    .popup p { margin: 4px 0; color: #9fb1c0; font-size: 11px; }
    .popup b { color: var(--cyan); font-weight: 500; }

    @media (max-width: 1280px) {
      .workspace { grid-template-columns: 250px minmax(420px, 1fr) 290px; }
      .kpi:nth-child(4) { display: none; }
      .kpis { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>上海市生活服务设施查询系统</h1>
          <p>SHANGHAI LIFE SERVICE FACILITY GIS</p>
        </div>
      </div>
      <div class="kpis">
        <div class="kpi" style="--kpi-color:var(--cyan)">
          <div class="kpi-label">设施总数</div>
          <div class="kpi-value" id="totalCount">0<small>处</small></div>
        </div>
        <div class="kpi" style="--kpi-color:var(--green)">
          <div class="kpi-label">当前营业</div>
          <div class="kpi-value" id="openRate">0<small>% 营业率</small></div>
        </div>
        <div class="kpi" style="--kpi-color:var(--orange)">
          <div class="kpi-label">高峰设施</div>
          <div class="kpi-value" id="busyCount">0<small>处繁忙</small></div>
        </div>
        <div class="kpi" style="--kpi-color:var(--red)">
          <div class="kpi-label">服务提醒</div>
          <div class="kpi-value pulse" id="closedCount">0<small>处暂停</small></div>
        </div>
      </div>
      <div class="time-box">
        <strong id="clock">--:--:--</strong>
        <span id="date">----年--月--日</span>
      </div>
    </header>

    <section class="workspace">
      <aside class="panel left-panel">
        <div class="section">
          <h2 class="section-title"><span>设施查询</span></h2>
          <label class="search">
            <input id="searchInput" type="search" placeholder="搜索名称、地址或类别…" aria-label="搜索生活服务设施">
          </label>
        </div>
        <div class="section">
          <h2 class="section-title"><span>设施分类</span><span class="count">多选筛选</span></h2>
          <div class="category-grid" id="categoryFilters"></div>
        </div>
        <div class="section">
          <h2 class="section-title"><span>营业状态</span></h2>
          <div class="status-list" id="statusFilters"></div>
        </div>
        <div class="section mini-chart-wrap">
          <h2 class="section-title"><span>分类占比</span><span class="count">实时更新</span></h2>
          <div id="categoryChart"></div>
        </div>
      </aside>

      <section class="map-shell" aria-label="上海市生活服务设施地图">
        <div id="map"></div>
        <div class="map-vignette"></div>
        <div class="map-title">
          <strong>上海全市 · 设施空间分布</strong>
          <span>使用左上角工具框选或绘制查询区域</span>
        </div>
        <div class="draw-toolbar">
          <button id="drawPolygon" type="button">多边形圈选</button>
          <button id="drawRectangle" type="button">矩形框选</button>
        </div>
        <button class="basemap-switch" id="basemapSwitch" type="button" aria-label="切换地图底图样式">
          底图：深色
        </button>
        <div class="map-legend">
          <span><i style="--c:var(--green)"></i>营业中</span>
          <span><i style="--c:var(--orange)"></i>高峰期</span>
          <span><i style="--c:var(--gray)"></i>已暂停</span>
          <span><i style="--c:var(--cyan)"></i>上海市域</span>
        </div>
      </section>

      <aside class="panel right-panel">
        <div class="right-head">
          <h2 class="selected-name" id="areaName">上海市 · 全部区域</h2>
          <div class="selected-meta" id="resultMeta">正在加载周边服务设施…</div>
          <div class="area-actions">
            <button class="area-btn" id="resetArea" type="button">恢复全市统计</button>
            <span class="draw-tip">绘制完成后自动统计区域内点位</span>
          </div>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="chart-panel">
          <h2 class="section-title"><span>近 7 天到访趋势</span><span class="count" id="trendLabel">全部设施</span></h2>
          <div id="trendChart"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="./config.js"></script>
  <script>
    if (!window.AMAP_CONFIG?.key || !window.AMAP_CONFIG?.securityJsCode) {
      document.body.innerHTML = "<div style='padding:40px;font-family:sans-serif'>请先复制 config.example.js 为 config.js，并填写高德 Web端 Key 与安全密钥。</div>";
      throw new Error("缺少高德地图配置");
    }
    window._AMapSecurityConfig = {
      securityJsCode: window.AMAP_CONFIG.securityJsCode
    };
    document.write(
      '<script src="https://webapi.amap.com/maps?v=2.0&key=' +
      encodeURIComponent(window.AMAP_CONFIG.key) +
      '&plugin=AMap.PlaceSearch,AMap.DistrictSearch,AMap.MouseTool,AMap.ToolBar,AMap.Scale"><\/script>'
    );
  </script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script>
    /*
     * ===== 分类配置区 =====
     * 设施数据现由高德 PlaceSearch 动态返回；高德坐标格式为 [经度, 纬度]。
     */
    const categories = {
      all:       { name: "全部", icon: "◉", color: "#38d9c5" },
      food:      { name: "餐饮咖啡", icon: "☕", color: "#ff7657" },
      shop:      { name: "便利购物", icon: "袋", color: "#4698ff" },
      delivery:  { name: "快递服务", icon: "递", color: "#a97cff" },
      restroom:  { name: "公共卫生间", icon: "♿", color: "#39c5d8" },
      charging:  { name: "充电设施", icon: "⚡", color: "#f5c451" },
      transit:   { name: "公共交通", icon: "交", color: "#54c987" }
    };

    const statusConfig = {
      open:   { name: "营业中", color: "#42d392" },
      busy:   { name: "高峰期", color: "#ffab4c" },
      closed: { name: "暂停服务", color: "#8795a3" }
    };

    const searchTerms = {
      food: "餐厅",
      shop: "便利店",
      delivery: "快递",
      restroom: "公共厕所",
      charging: "充电站|充电桩",
      transit: "地铁站"
    };
    const appState = {
      category: "all",
      statuses: new Set(["open", "busy", "closed"]),
      keyword: "",
      selectedId: null,
      allPois: [],
      selectionOverlay: null,
      markers: [],
      loading: true
    };
    const basemapStyles = [
      { name: "深色", value: "amap://styles/darkblue" },
      { name: "标准", value: "amap://styles/normal" },
      { name: "浅色", value: "amap://styles/whitesmoke" }
    ];
    let basemapStyleIndex = 0;

    const amap = new AMap.Map("map", {
      viewMode: "2D",
      zoom: 8.8,
      center: [121.47, 31.23],
      mapStyle: "amap://styles/darkblue",
      showLabel: true
    });
    amap.addControl(new AMap.ToolBar({ position: { right: "18px", bottom: "56px" } }));
    amap.addControl(new AMap.Scale());
    const infoWindow = new AMap.InfoWindow({ offset: new AMap.Pixel(0, -26), closeWhenClickMap: true });
    const mouseTool = new AMap.MouseTool(amap);
    let boundaryPolygons = [];

    function stableNumber(text) {
      let value = 0;
      for (let i = 0; i < text.length; i++) value = ((value << 5) - value + text.charCodeAt(i)) | 0;
      return Math.abs(value);
    }

    function operationalData(id) {
      const seed = stableNumber(id);
      const status = seed % 13 === 0 ? "closed" : seed % 5 === 0 ? "busy" : "open";
      const base = 80 + seed % 360;
      return {
        status,
        queue: status === "busy" ? 8 + seed % 18 : status === "open" ? seed % 5 : 0,
        visits: [0,1,2,3,4,5,6].map(index => Math.round(base * (.78 + ((seed >> index) % 35) / 100)))
      };
    }

    function normalizePoi(poi, category) {
      const id = poi.id || `${category}-${poi.name}-${poi.location}`;
      const operation = operationalData(id);
      const location = poi.location;
      return {
        id,
        name: poi.name || "未命名设施",
        category,
        status: operation.status,
        coord: [Number(location.lng), Number(location.lat)],
        address: [poi.pname, poi.cityname, poi.adname, poi.address].filter(Boolean).join(""),
        hours: operation.status === "closed" ? "暂停服务（演示）" : "以现场公示为准",
        queue: operation.queue,
        district: poi.adname || "上海市",
        tel: Array.isArray(poi.tel) ? poi.tel.join(" / ") : (poi.tel || "暂无"),
        visits: operation.visits
      };
    }

    function loadShanghaiBoundary() {
      const districtSearch = new AMap.DistrictSearch({ subdistrict: 0, extensions: "all", level: "city" });
      districtSearch.search("上海市", (status, result) => {
        if (status !== "complete" || !result.districtList?.[0]?.boundaries) return;
        boundaryPolygons.forEach(polygon => amap.remove(polygon));
        boundaryPolygons = result.districtList[0].boundaries.map(path => new AMap.Polygon({
          path,
          strokeColor: "#38d9c5",
          strokeWeight: 2.5,
          fillColor: "#38d9c5",
          fillOpacity: .08,
          zIndex: 5
        }));
        amap.add(boundaryPolygons);
        amap.setFitView(boundaryPolygons, false, [45, 45, 45, 45], 9);
      });
    }

    function searchCategory(category, bounds = null) {
      return new Promise(resolve => {
        const service = new AMap.PlaceSearch({
          city: "310000",
          citylimit: true,
          pageSize: 50,
          pageIndex: 1,
          extensions: "all"
        });
        const callback = (status, result) => {
          if (status !== "complete" || !result.poiList?.pois) return resolve([]);
          resolve(result.poiList.pois.filter(poi => poi.location).map(poi => normalizePoi(poi, category)));
        };
        bounds ? service.searchInBounds(searchTerms[category], bounds, callback) : service.search(searchTerms[category], callback);
      });
    }

    async function loadPois(bounds = null) {
      appState.loading = true;
      document.getElementById("resultMeta").textContent = bounds ? "正在检索圈选区域内的高德 POI…" : "正在检索上海全市高德 POI…";
      const groups = await Promise.all(Object.keys(searchTerms).map(key => searchCategory(key, bounds)));
      const unique = new Map();
      groups.flat().forEach(item => unique.set(item.id, item));
      appState.allPois = [...unique.values()];
      appState.loading = false;
      appState.selectedId = null;
      renderAllFilters();
      updateAmapView();
    }

    function getAmapFilteredData() {
      const keyword = appState.keyword.toLowerCase();
      return appState.allPois.filter(item => {
        const categoryOk = appState.category === "all" || item.category === appState.category;
        const statusOk = appState.statuses.has(item.status);
        const text = `${item.name}${item.address}${item.district}${categories[item.category].name}`.toLowerCase();
        return categoryOk && statusOk && text.includes(keyword);
      });
    }

    function markerContent(item) {
      const category = categories[item.category];
      const color = item.status === "closed" ? statusConfig.closed.color : category.color;
      return `<div class="custom-marker ${item.status === "busy" ? "busy" : ""}" style="background:${color}"><span>${category.icon}</span></div>`;
    }

    function popupContent(item) {
      return `<div class="popup">
        <h3>${categories[item.category].icon} ${item.name}</h3>
        <p>分类：<b>${categories[item.category].name}</b> · ${statusConfig[item.status].name}</p>
        <p>行政区：${item.district}</p>
        <p>地址：${item.address || "暂无详细地址"}</p>
        <p>电话：${item.tel}</p>
        <p>营业信息：${item.hours}</p>
        <p>模拟拥挤度：<b>${item.queue ? item.queue + " 人" : "较空闲"}</b></p>
      </div>`;
    }

    function renderAmapMarkers(data) {
      if (appState.markers.length) amap.remove(appState.markers);
      appState.markers = data.map(item => {
        const marker = new AMap.Marker({
          position: item.coord,
          content: markerContent(item),
          offset: new AMap.Pixel(-17, -32),
          title: item.name,
          zIndex: 20
        });
        marker.on("click", () => selectAmapPoi(item.id, true));
        return marker;
      });
      amap.add(appState.markers);
    }

    function renderAmapList(data) {
      const list = document.getElementById("resultList");
      document.getElementById("resultMeta").textContent = appState.loading
        ? "正在加载高德 POI…"
        : `高德返回 ${appState.allPois.length} 条 · 当前显示 ${data.length} 条`;
      list.innerHTML = data.length ? data.map(item => `
        <article class="poi-card ${appState.selectedId === item.id ? "active" : ""}" data-id="${item.id}" tabindex="0">
          <div class="poi-icon" style="color:${categories[item.category].color}">${categories[item.category].icon}</div>
          <div class="poi-main">
            <div class="poi-name">${item.name}</div>
            <div class="poi-address">${item.address || "暂无详细地址"}</div>
            <div class="poi-status" style="--status:${statusConfig[item.status].color}">${statusConfig[item.status].name}</div>
          </div>
          <div class="poi-distance">${item.district}</div>
        </article>
      `).join("") : `<div style="padding:40px 15px;text-align:center;color:var(--muted);font-size:12px">${appState.loading ? "正在加载…" : "暂无符合条件的设施"}</div>`;
      list.querySelectorAll(".poi-card").forEach(card => {
        const activate = () => selectAmapPoi(card.dataset.id, true);
        card.addEventListener("click", activate);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") activate();
        });
      });
    }

    const amapCategoryChart = echarts.init(document.getElementById("categoryChart"));
    const amapTrendChart = echarts.init(document.getElementById("trendChart"));

    function renderAmapCharts(data, selected = null) {
      const pieData = Object.keys(categories).filter(key => key !== "all").map(key => ({
        name: categories[key].name,
        value: data.filter(item => item.category === key).length,
        itemStyle: { color: categories[key].color }
      })).filter(item => item.value);
      amapCategoryChart.setOption({
        tooltip: { trigger: "item", backgroundColor: "#0c2034", borderColor: "#294961", textStyle: { color: "#e8f1f8", fontSize: 11 } },
        series: [{ type: "pie", radius: ["42%","62%"], center: ["50%","50%"], avoidLabelOverlap: true, label: { color: "#8fa5b7", fontSize: 9, formatter: "{b}\n{d}%" }, labelLine: { length: 8, length2: 6 }, data: pieData }]
      }, true);
      const chartSource = selected ? [selected] : data;
      const values = Array.from({ length: 7 }, (_, index) => chartSource.reduce((sum, item) => sum + item.visits[index], 0));
      document.getElementById("trendLabel").textContent = selected ? selected.name : (appState.category === "all" ? "全部设施" : categories[appState.category].name);
      amapTrendChart.setOption({
        grid: { left: 38, right: 12, top: 16, bottom: 25 },
        tooltip: { trigger: "axis", backgroundColor: "#0c2034", borderColor: "#294961", textStyle: { color: "#e8f1f8", fontSize: 11 } },
        xAxis: { type: "category", boundaryGap: false, data: ["周一","周二","周三","周四","周五","周六","周日"], axisLine: { lineStyle: { color: "#294258" } }, axisLabel: { color: "#738ba0", fontSize: 9 } },
        yAxis: { type: "value", splitLine: { lineStyle: { color: "rgba(82,118,146,.14)" } }, axisLabel: { color: "#738ba0", fontSize: 9 } },
        series: [{ type: "line", smooth: true, symbolSize: 5, lineStyle: { width: 2, color: "#38d9c5" }, itemStyle: { color: "#38d9c5" }, areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{ offset:0,color:"rgba(56,217,197,.35)"},{ offset:1,color:"rgba(56,217,197,0)"}]) }, data: values }]
      }, true);
    }

    function renderAmapKpis(data) {
      const open = data.filter(item => item.status === "open").length;
      const busy = data.filter(item => item.status === "busy").length;
      const closed = data.filter(item => item.status === "closed").length;
      document.getElementById("totalCount").innerHTML = `${data.length}<small>处</small>`;
      document.getElementById("openRate").innerHTML = `${data.length ? Math.round(open / data.length * 100) : 0}<small>% 营业率</small>`;
      document.getElementById("busyCount").innerHTML = `${busy}<small>处繁忙</small>`;
      document.getElementById("closedCount").innerHTML = `${closed}<small>处暂停</small>`;
    }

    function renderAllFilters() {
      const container = document.getElementById("categoryFilters");
      container.innerHTML = Object.entries(categories).map(([key, item]) => {
        const count = key === "all" ? appState.allPois.length : appState.allPois.filter(poi => poi.category === key).length;
        return `<button class="filter-btn ${key === appState.category ? "active" : ""}" data-category="${key}">
          <span class="icon" style="color:${item.color}">${item.icon}</span><span class="label">${item.name}</span><span class="num">${count}</span>
        </button>`;
      }).join("");
      container.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        appState.category = button.dataset.category;
        appState.selectedId = null;
        renderAllFilters();
        updateAmapView();
      }));
      const statusBox = document.getElementById("statusFilters");
      statusBox.innerHTML = Object.entries(statusConfig).map(([key,item]) => `
        <div class="status-row"><input id="status-${key}" type="checkbox" data-status="${key}" ${appState.statuses.has(key) ? "checked" : ""}>
        <label for="status-${key}"><i class="status-dot" style="--status:${item.color}"></i>${item.name}</label>
        <em>${appState.allPois.filter(poi => poi.status === key).length}</em></div>
      `).join("");
      statusBox.querySelectorAll("input").forEach(input => input.addEventListener("change", () => {
        input.checked ? appState.statuses.add(input.dataset.status) : appState.statuses.delete(input.dataset.status);
        updateAmapView();
      }));
    }

    function selectAmapPoi(id, openPopup) {
      const item = appState.allPois.find(poi => String(poi.id) === String(id));
      if (!item) return;
      appState.selectedId = item.id;
      const data = getAmapFilteredData();
      renderAmapList(data);
      renderAmapCharts(data, item);
      if (openPopup) {
        amap.setZoomAndCenter(16, item.coord);
        infoWindow.setContent(popupContent(item));
        infoWindow.open(amap, item.coord);
      }
    }

    function updateAmapView() {
      const data = getAmapFilteredData();
      renderAmapKpis(data);
      renderAmapMarkers(data);
      renderAmapList(data);
      renderAmapCharts(data);
    }

    function startDraw(type) {
      mouseTool.close(false);
      const style = { strokeColor: "#ffcc66", strokeWeight: 2, fillColor: "#ffcc66", fillOpacity: .16 };
      type === "polygon" ? mouseTool.polygon(style) : mouseTool.rectangle(style);
    }

    mouseTool.on("draw", event => {
      if (appState.selectionOverlay) amap.remove(appState.selectionOverlay);
      appState.selectionOverlay = event.obj;
      mouseTool.close(false);
      document.getElementById("areaName").textContent = "自定义查询区域";
      amap.setFitView([event.obj], false, [60,60,60,60], 13);
      loadPois(event.obj);
    });

    document.getElementById("drawPolygon").addEventListener("click", () => startDraw("polygon"));
    document.getElementById("drawRectangle").addEventListener("click", () => startDraw("rectangle"));
    document.getElementById("basemapSwitch").addEventListener("click", event => {
      basemapStyleIndex = (basemapStyleIndex + 1) % basemapStyles.length;
      const style = basemapStyles[basemapStyleIndex];
      amap.setMapStyle(style.value);
      event.currentTarget.textContent = `底图：${style.name}`;
    });
    document.getElementById("resetArea").addEventListener("click", () => {
      mouseTool.close(false);
      if (appState.selectionOverlay) amap.remove(appState.selectionOverlay);
      appState.selectionOverlay = null;
      document.getElementById("areaName").textContent = "上海市 · 全部区域";
      boundaryPolygons.length && amap.setFitView(boundaryPolygons, false, [45,45,45,45], 9);
      loadPois();
    });
    document.getElementById("searchInput").addEventListener("input", event => {
      appState.keyword = event.target.value.trim();
      updateAmapView();
    });

    function updateAmapClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString("zh-CN", { hour12: false });
      document.getElementById("date").textContent = now.toLocaleDateString("zh-CN", { year:"numeric", month:"long", day:"numeric", weekday:"short" });
    }

    loadShanghaiBoundary();
    renderAllFilters();
    updateAmapView();
    loadPois();
    updateAmapClock();
    setInterval(updateAmapClock, 1000);
    window.addEventListener("resize", () => {
      amap.resize();
      amapCategoryChart.resize();
      amapTrendChart.resize();
    });
  </script>
</body>
</html>
